<!doctype html>
<html>
  <head>
    <title>Verify</title>

    <style>
      body {
        background: #020617;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
      }

      .container {
        background: #111827;
        padding: 30px;
        border-radius: 12px;
        width: 350px;
      }

      h2 {
        text-align: center;
        color: #22c55e;
      }

      p {
        text-align: center;
        margin-bottom: 10px;
      }

      input,
      button {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 6px;
        border: none;
      }

      button {
        background: #22c55e;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>🔐 Security Verification</h2>

      <form method="POST" action="/verify">
        <input
          type="hidden"
          name="account_number"
          value="{{ user.account_number }}"
        />

        <p>{{ user.security_question }}</p>

        <input
          type="text"
          name="answer"
          placeholder="Enter your answer"
          required
        />

        <button type="submit">Verify</button>
      </form>
    </div>
  </body>
</html>
