<!doctype html>
<html>
  <head>
    <title>SOC Login</title>

    <style>
      body {
        background: #020617;
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
      }

      .container {
        background: #111827;
        padding: 30px;
        border-radius: 12px;
        width: 320px;
      }

      h2 {
        text-align: center;
        color: #38bdf8;
      }

      input,
      button {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 6px;
        border: none;
      }

      button {
        background: #38bdf8;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>🛡️ SOC Admin Login</h2>

      <form method="POST">
        <input type="text" name="admin_id" placeholder="Admin ID" required />
        <input type="text" name="username" placeholder="Username" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />

        <button type="submit">Login</button>
      </form>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);

      if (params.get("msg") === "invalid") {
        alert("❌ Invalid SOC admin credentials.");
      }
    </script>
  </body>
</html>
