<!doctype html>
<html>
  <head>
    <title>User Registration</title>

    <style>
      body {
        background: linear-gradient(to right, #020617, #0f172a);
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
      }

      .container {
        background: #111827;
        padding: 35px;
        border-radius: 14px;
        width: 380px;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
      }

      h2 {
        text-align: center;
        color: #22c55e;
        margin-bottom: 20px;
      }

      label {
        font-size: 13px;
        color: #94a3b8;
      }

      input {
        width: 100%;
        padding: 11px;
        margin-top: 6px;
        margin-bottom: 16px;
        border-radius: 8px;
        border: 1px solid #1e293b;
        background: #020617;
        color: white;
        outline: none;
      }

      input:focus {
        border: 1px solid #22c55e;
      }

      /* button */
      button {
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #22c55e, #16a34a);
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      button:hover {
        transform: scale(1.03);
      }

      /* small note */
      .note {
        font-size: 12px;
        text-align: center;
        margin-top: 10px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>🏦 HVR Bank Registration</h2>
      <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("msg") === "nomatch") {
          alert("❌ Passwords do not match. Please try again.");
        }
      </script>
      <form method="POST">
        <label>Account Number</label>
        <input
          type="number"
          name="account_number"
          placeholder="Enter your account number"
          required
        />

        <label>Email</label>
        <input
          type="email"
          name="email"
          placeholder="Enter your email address"
          required
        />

        <label>Create Password</label>
        <input
          type="password"
          name="password"
          placeholder="Create a strong password"
          required
        />

        <label>Confirm Password</label>
        <input
          type="password"
          name="confirm_password"
          placeholder="Re-enter your password"
          required
        />

        <label>Security Question</label>
        <input
          type="text"
          name="question"
          placeholder="e.g. Your first school name?"
          required
        />

        <label>Answer</label>
        <input
          type="text"
          name="answer"
          placeholder="Enter your answer"
          required
        />

        <button type="submit">Create Account</button>
      </form>

      <div class="note">🔒 Your data is securely stored</div>
    </div>
  </body>
</html>
