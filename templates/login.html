<!doctype html>
<html>
  <head>
    <title>User Login</title>

    <style>
      body {
        background: linear-gradient(to right, #020617, #0f172a);
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
      }

      .container {
        background: #111827;
        padding: 35px;
        border-radius: 14px;
        width: 350px;
      }

      h2 {
        text-align: center;
        color: #22c55e;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 6px;
        border: none;
        background: #020617;
        color: white;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #22c55e;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
      }

      a {
        color: #38bdf8;
        font-size: 13px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>🔐 User Login</h2>
      <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("msg") === "registered") {
          alert("✅ Registration successful! Please login.");
        }

        if (params.get("msg") === "exists") {
          alert("⚠️ Account already exists. Please login.");
        }
        if (params.get("msg") === "reset") {
          alert("🔑 Password updated successfully! Please login.");
        }
        if (params.get("msg") === "registered") {
          alert("✅ Registration successful! Please login.");
        }

        if (params.get("msg") === "exists") {
          alert("⚠️ Account already exists. Please login.");
        }

        if (params.get("msg") === "invalid") {
          alert("❌ Invalid account number or password.");
        }

        if (params.get("msg") === "attack") {
          alert(
            "🚨 Suspicious activity detected! Account temporarily flagged.",
          );
        }
      </script>
      <form method="POST">
        <input
          type="number"
          name="account_number"
          placeholder="Account Number"
          required
        />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />

        <button type="submit">Login</button>
      </form>

      <p><a href="/register">New user? Register</a></p>
      <p><a href="/forgot">Forgot Password?</a></p>
    </div>
  </body>
</html>
