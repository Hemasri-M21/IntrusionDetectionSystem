<!doctype html>
<html>
  <head>
    <title>SOC Dashboard</title>

    <style>
      body {
        background: #020617;
        font-family: Arial;
        color: white;
        margin: 0;
        padding: 20px;
      }

      h1 {
        color: #38bdf8;
        text-align: center;
      }

      /* SEARCH */
      .search-box {
        text-align: center;
        margin-top: 20px;
      }

      input,
      select {
        padding: 10px;
        width: 220px;
        border-radius: 8px;
        border: none;
      }

      button {
        padding: 10px 15px;
        border: none;
        border-radius: 8px;
        background: #38bdf8;
        color: white;
        cursor: pointer;
        margin-left: 5px;
      }

      /* GRID */
      .dashboard {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 30px;
      }

      /* CARD */
      .card {
        background: #111827;
        padding: 20px;
        border-radius: 12px;
      }

      /* STATUS */
      #status {
        font-size: 20px;
        font-weight: bold;
        white-space: pre-line;
      }

      /* METER */
      #meterBox {
        width: 100%;
        height: 20px;
        background: #1e293b;
        border-radius: 10px;
        margin-top: 15px;
      }

      #meter {
        height: 100%;
        width: 10%;
        background: #22c55e;
        border-radius: 10px;
        transition: 0.5s;
      }

      /* COLORS */
      .safe {
        color: #22c55e;
      }
      .alert {
        color: #ef4444;
      }

      /* LOG */
      #log {
        margin-top: 10px;
        font-size: 14px;
        max-height: 150px;
        overflow-y: auto;
      }

      /* LOADING */
      #loading {
        display: none;
        margin-top: 10px;
        color: #facc15;
      }
    </style>
  </head>

  <body>
    <h1>🛡️ SOC Intrusion Monitoring Dashboard</h1>
    <button
      onclick="window.location.href = '/soc-logout'"
      style="
        position: absolute;
        top: 20px;
        right: 20px;
        background: #ef4444;
        padding: 8px 12px;
        border: none;
        border-radius: 6px;
        color: white;
      "
    >
      Logout
    </button>
    <!-- SEARCH -->
    <div class="search-box">
      <select id="preset">
        <option value="">Select site</option>
        <option value="amazon.com">amazon.com</option>
        <option value="flipkart.com">flipkart.com</option>
        <option value="google.com">google.com</option>
        <option value="github.com">github.com</option>
        <option value="jntuacep.ac.in">jntuacep.ac.in</option>
        <option value="sbi.co.in">sbi.co.in</option>
      </select>

      <input type="text" id="website" placeholder="or enter website" />

      <button onclick="scanWebsite()">Scan</button>
      <button onclick="resumeAuto()">Resume Auto</button>

      <!-- 🏦 NEW BUTTON -->
      <button onclick="loadBankSystem()">🏦 Bank System</button>

      <div id="loading">⏳ Scanning...</div>
    </div>

    <div class="dashboard">
      <div class="card">
        <div id="status" class="safe">Monitoring network traffic...</div>

        <div id="meterBox">
          <div id="meter"></div>
        </div>
      </div>

      <div class="card">
        <h3>📊 System Stats</h3>
        <p>Total Scans: <span id="total">0</span></p>
        <p>Attacks Detected: <span id="attacks">0</span></p>
      </div>
    </div>

    <div class="card" style="margin-top: 20px">
      <h3>🧾 Recent Activity</h3>
      <div id="log"></div>
    </div>

    <script>
      const BASE_URL = "https://hvrbank-system.onrender.com"; // 🔥 CHANGE if needed

      let total = 0;
      let attacks = 0;

      let autoInterval = null;
      let isAutoRunning = false;

      /* ================= AUTO CONTROL ================= */

      function startAutoScan() {
        if (autoInterval) return;

        isAutoRunning = true;

        autoInterval = setInterval(() => {
          let mode = Math.random() > 0.7 ? "attack" : "normal";

          fetch(BASE_URL + "/predict/" + mode)
            .then((res) => res.json())
            .then((data) => handleResponse("Auto Scan", data))
            .catch((err) => console.error("Auto error:", err));
        }, 3000);
      }

      function stopAutoScan() {
        clearInterval(autoInterval);
        autoInterval = null;
        isAutoRunning = false;
      }

      /* ================= WEBSITE SCAN ================= */

      function scanWebsite() {
        stopAutoScan();

        let preset = document.getElementById("preset").value;
        let input = document.getElementById("website").value;
        let site = input || preset || "Unknown Site";

        document.getElementById("loading").style.display = "block";

        let mode = Math.random() > 0.5 ? "attack" : "normal";

        fetch(BASE_URL + "/predict/" + mode)
          .then((res) => res.json())
          .then((data) => {
            document.getElementById("loading").style.display = "none";
            handleResponse(site, data);
          })
          .catch((err) => console.error("Scan error:", err));
      }

      /* ================= BANK SYSTEM ================= */

      function loadBankSystem() {
        stopAutoScan();

        fetch(BASE_URL + "/bank-attacks") // 🔥 FIXED
          .then((res) => res.json())
          .then((data) => {
            let status = document.getElementById("status");
            let meter = document.getElementById("meter");

            if (data.length === 0) {
              status.className = "safe";
              status.innerText = "🏦 BANK SYSTEM\n\n✅ No Threats Detected";
              meter.style.width = "20%";
              meter.style.background = "#22c55e";
              return;
            }

            let latest = data[data.length - 1];

            status.className = "alert";
            status.innerText =
              "🏦 BANK SYSTEM ALERT\n\n" +
              "⚠️ Attack: " +
              latest.type +
              "\n" +
              "Account: " +
              latest.account +
              "\n" +
              "Confidence: 92%";

            meter.style.width = "90%";
            meter.style.background = "#ef4444";

            addLog(
              "🏦 Bank Attack: " + latest.type + " (" + latest.account + ")",
            );
          })
          .catch((err) => console.error("Bank error:", err));
      }

      /* ================= COMMON HANDLER ================= */

      function handleResponse(site, data) {
        updateStats(data);

        if (data.result == 1) {
          showAttack(site, data);
          addLog("⚠️ " + site + " → " + data.attack);
        } else {
          showNormal(site, data);
          addLog("✅ " + site + " safe");
        }
      }

      /* ================= STATS ================= */

      function updateStats(data) {
        total++;
        document.getElementById("total").innerText = total;

        if (data.result == 1) {
          attacks++;
          document.getElementById("attacks").innerText = attacks;
        }
      }

      /* ================= DISPLAY ================= */

      function showAttack(site, data) {
        let status = document.getElementById("status");
        let meter = document.getElementById("meter");

        status.className = "alert";
        status.innerText =
          "🌐 Website: " +
          site +
          "\n\n" +
          "⚠️ INTRUSION DETECTED\n" +
          "Type: " +
          data.attack +
          "\n" +
          "Confidence: " +
          data.confidence +
          "%";

        meter.style.width = data.confidence + "%";
        meter.style.background = "#ef4444";
      }

      function showNormal(site, data) {
        let status = document.getElementById("status");
        let meter = document.getElementById("meter");

        status.className = "safe";
        status.innerText =
          "🌐 Website: " +
          site +
          "\n\n" +
          "✅ No Threat Detected\n" +
          "Confidence: " +
          data.confidence +
          "%";

        meter.style.width = data.confidence + "%";
        meter.style.background = "#22c55e";
      }

      /* ================= LOG ================= */

      function addLog(text) {
        let log = document.getElementById("log");
        let time = new Date().toLocaleTimeString();

        let entry = document.createElement("div");
        entry.innerText = "[" + time + "] " + text;

        log.prepend(entry);
      }

      /* ================= AUTO FILL ================= */

      document.getElementById("preset").addEventListener("change", function () {
        document.getElementById("website").value = this.value;
      });
    </script>
  </body>
</html>
