<!doctype html>
<html>
  <head>
    <title>Admin Login</title>

    <style>
      body {
        background: linear-gradient(to right, #020617, #0f172a);
        font-family: Arial;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
      }

      .container {
        background: #111827;
        padding: 35px;
        border-radius: 14px;
        width: 350px;
      }

      h2 {
        text-align: center;
        color: #facc15;
      }

      input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 6px;
        border: none;
        background: #020617;
        color: white;
      }

      button {
        width: 100%;
        padding: 10px;
        background: #facc15;
        border: none;
        border-radius: 6px;
        color: black;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>👨‍💼 Admin Login</h2>
      <script>
        const params = new URLSearchParams(window.location.search);

        if (params.get("msg") === "invalid") {
          alert("❌ Invalid admin credentials. Please try again.");
        }
      </script>
      <form method="POST">
        <input type="text" name="admin_id" placeholder="Admin ID" required />
        <input type="text" name="username" placeholder="Username" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />

        <button type="submit">Login</button>
      </form>
    </div>
  </body>
</html>
