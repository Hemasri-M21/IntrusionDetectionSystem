<!doctype html>
<html>
  <head>
    <title>Bank System</title>

    <style>
      body {
        background: linear-gradient(to right, #020617, #0f172a);
        font-family: Arial;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        text-align: center;
      }

      h1 {
        color: #38bdf8;
      }

      button {
        display: block;
        width: 220px;
        margin: 15px auto;
        padding: 12px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
      }

      .user {
        background: #22c55e;
      }
      .admin {
        background: #facc15;
        color: black;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>🏦 HVR Bank System</h1>

      <button class="user" onclick="location.href = '/login'">
        👤 User Login
      </button>

      <button class="admin" onclick="location.href = '/admin-login'">
        👨‍💼 Admin Login
      </button>
      <button
        onclick="window.location.href = '/soc-login'"
        style="
          background: #38bdf8;
          color: white;
          padding: 12px;
          border: none;
          border-radius: 8px;
          margin-top: 10px;
          width: 250px;
          font-size: 16px;
          cursor: pointer;
        "
      >
        🛡️ SOC Dashboard
      </button>
    </div>
  </body>
</html>
